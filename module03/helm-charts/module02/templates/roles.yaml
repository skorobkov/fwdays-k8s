---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fwdays:read-role
  labels:
    rbac-aggregate-to-fwdays-rw-role: "true"
rules: {{ .Values.readRoleRules | toYaml | nindent 2 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fwdays:write-role
  labels:
    rbac-aggregate-to-fwdays-rw-role: "true"
rules: {{ .Values.writeRoleRules | toYaml | nindent 2 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fwdays:rw-role
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac-aggregate-to-fwdays-rw-role: "true"
