---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fwdays-read-only-root-fs
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true
        )
      message: "readOnlyRootFilesystem must be true"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fwdays-read-only-root-fs
spec:
  policyName: fwdays-read-only-root-fs
  validationActions: [Audit, Warn]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - mentor
            - student01
            - student02
            - student03

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: "fwdays-pod-label-policy"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: person
      expression: >
        namespaceObject.metadata.name.matches('^mentor$') ? 'mentor' :
        namespaceObject.metadata.name.matches('^student[0-9]+$') ? 'student' :
        ''
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: "ApplyConfiguration"
      applyConfiguration:
        expression: >
          variables.person != ''
            ? Object{ metadata: Object.metadata{ labels: { "person": variables.person } } }
            : Object{}
    - patchType: "JSONPatch"
      jsonPatch:
        expression: >
          variables.person == '' && has(object.metadata.labels) && has(object.metadata.labels.person)
            ? [JSONPatch{op: "remove", path: "/metadata/labels/person"} ]
            : []

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: fwdays-pod-label-policy-binding
spec:
  policyName: fwdays-pod-label-policy
