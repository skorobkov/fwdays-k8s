apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: k8s-monitoring
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.1
    helm:
      releaseName: grafana
      valuesObject:
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server
                access: proxy
                isDefault: true
                jsonData:
                  timeInterval: 1m
              - name: Loki
                type: loki
                url: http://loki-gateway
                access: proxy
        dashboards:
          default:
            node-exporter:
              url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/refs/heads/master/prometheus/node-exporter-full.json
              curlOptions: -Lf
            vap:
              url: https://raw.githubusercontent.com/skorobkov/fwdays-k8s/refs/heads/module05/module05/grafana/dashboards/vap.json
              curlOptions: -Lf
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                type: file
                options:
                  path: /var/lib/grafana/dashboards/default
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
